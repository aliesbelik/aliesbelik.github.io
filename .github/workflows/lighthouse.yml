name: Lighthouse Check

on:
  schedule:
  - cron: "0 5 * * 3"    
  workflow_dispatch:

env:
  websiteUrl: 'https://aliesbelik.github.io/'
  outputDir: ${{ github.workspace }}/lh-artifacts

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Create artifacts dir
      run: mkdir -p ${{ env.outputDir }}
    - name: Lighthouse checks
      uses: foo-software/lighthouse-check-action@a80267da2e0244b8a2e457a8575fc47590615852 # v12.0.1
      with:
        urls: ${{ env.websiteUrl }}
        outputDirectory: ${{ env.outputDir }}
    - name: Upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: Lighthouse reports
        path: ${{ env.outputDir }}
